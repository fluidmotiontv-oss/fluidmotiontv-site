<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER DRAGON-9 | Holographic Cyber Dragon Flight Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --surface: rgba(15, 23, 42, 0.75);
            --surface-border: rgba(56, 189, 248, 0.2);
            --neon-cyan: #38bdf8;
            --neon-magenta: #e879f9;
            --neon-gold: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #webgl-container { position: absolute; inset: 0; z-index: 1; }
        #webgl-container canvas { display: block; cursor: grab; }
        #webgl-container canvas.dragging { cursor: grabbing; }

        .hud-overlay {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px;
        }
        header, .control-dock, .easter-egg-banner { pointer-events: auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-left: 4px solid var(--neon-cyan);
            padding: 14px 26px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
        }
        .brand h1 {
            font-size: 1.3rem; font-weight: 900; letter-spacing: 0.14em;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-cyan));
            background-size: 250% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            animation: titleFlow 8s linear infinite;
        }
        @keyframes titleFlow { 0% { background-position: 0% 50%; } 100% { background-position: 250% 50%; } }
        .brand p { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.08em; }

        .telemetry { display: flex; gap: 22px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
        .telemetry-item span { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(56,189,248,0.6); }

        .bottom-stack { display: flex; flex-direction: column; align-items: center; }

        .hint {
            font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
            color: var(--text-muted);
            background: rgba(3,7,18,0.6);
            border: 1px solid rgba(148,163,184,0.15);
            padding: 6px 14px; border-radius: 9999px;
            margin-bottom: 10px; letter-spacing: 0.08em;
        }

        .control-dock {
            display: flex; gap: 12px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            padding: 12px 24px;
            clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 100%, 0 100%);
            margin-bottom: 12px;
        }
        .btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--text-main);
            padding: 9px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
            cursor: pointer; transition: all 0.3s ease;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .btn:hover { background: var(--neon-cyan); color: var(--bg-deep); box-shadow: 0 0 20px rgba(56,189,248,0.7); }
        .btn.active { background: var(--neon-magenta); border-color: var(--neon-magenta); color: var(--bg-deep); box-shadow: 0 0 20px rgba(232,121,249,0.7); }

        .easter-egg-banner {
            position: absolute; bottom: 24px; right: 24px;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            padding: 8px 16px; border-radius: 12px;
            font-size: 0.72rem; font-family: 'JetBrains Mono', monospace;
            cursor: pointer; z-index: 20;
            backdrop-filter: blur(8px); transition: all 0.3s ease;
        }
        .easter-egg-banner:hover { background: var(--neon-gold); color: var(--bg-deep); box-shadow: 0 0 24px rgba(250,204,21,0.6); }

        .kombucha-toast {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(3, 7, 18, 0.95);
            border: 2px solid var(--neon-gold);
            color: var(--neon-gold);
            font-size: 1.05rem; font-weight: 700;
            padding: 28px 40px;
            clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
            z-index: 200; text-align: center;
            box-shadow: 0 0 60px rgba(250,204,21,0.45);
            opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .kombucha-toast.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .bubble {
            position: fixed; bottom: -30px; z-index: 150;
            border-radius: 50%;
            border: 1px solid rgba(250,204,21,0.8);
            background: radial-gradient(circle at 35% 35%, rgba(250,204,21,0.5), rgba(250,204,21,0.05));
            pointer-events: none;
            animation: rise linear forwards;
        }
        @keyframes rise { to { transform: translateY(-115vh) translateX(3vw); opacity: 0; } }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 8px; text-align: center; padding: 10px; clip-path: none; }
            .telemetry { display: none; }
            .control-dock { flex-wrap: wrap; justify-content: center; padding: 10px 14px; }
            .hud-overlay { padding: 12px; }
            .easter-egg-banner { bottom: 96px; right: 12px; }
            .hint { display: none; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <header>
            <div class="brand">
                <h1>Aether Dragon-9</h1>
                <p>HOLOGRAPHIC CYBER DRAGON // FLIGHT MATRIX // FLUID MOTION OF THE FUTURE</p>
            </div>
            <div class="telemetry">
                <div class="telemetry-item">DIM: <span>9</span></div>
                <div class="telemetry-item">TUNING: <span id="freq-display">432 Hz</span></div>
                <div class="telemetry-item">FLIGHT: <span id="phase-display">DUAL-PHASE</span></div>
            </div>
        </header>

        <div class="bottom-stack">
            <div class="hint">DRAG TO ORBIT &nbsp;·&nbsp; THE DRAGON RIDES THE ∞</div>
            <div class="control-dock">
                <button class="btn active" id="btn-flow" onclick="toggleFlight()">Flight: Dual-Phase</button>
                <button class="btn" id="btn-harmonic" onclick="toggleHarmonicAudio()">432Hz Synth</button>
                <button class="btn" id="btn-reset" onclick="resetCameraView()">Recenter</button>
            </div>
        </div>
    </div>

    <div class="easter-egg-banner" onclick="triggerKombuchaEasterEgg()">
        🍵 FlowTouch Kombucha Vault [Active]
    </div>

    <div class="kombucha-toast" id="kombuchaToast">
        🍵 Kombucha Vault Initialized<br>
        <span style="font-size:0.8rem; font-weight:400;">Welcome to the fluid motion of the future.</span>
    </div>

    <script>
        // ============================================================
        // AETHER DRAGON-9 — aether-dragon × Aether-D9vr fusion
        // A holographic cyber dragon riding the Figure-8 flight path
        // ============================================================

        // --- Seeded PRNG (mulberry32) ---
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function() {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        const rand = mulberry32(999);

        // --- Core Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.011);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const orbit = {
            radius: 24, theta: 0.3, phi: 1.32,
            velTheta: 0, velPhi: 0,
            homeTheta: 0.3, homePhi: 1.32, homeRadius: 24,
            returning: false
        };
        function applyOrbit() {
            const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.radius * sp * Math.sin(orbit.theta),
                orbit.radius * cp,
                orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(0, 0, 0);
        }
        applyOrbit();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x8899ff, 0.5));
        const keyLight = new THREE.PointLight(0x38bdf8, 1.6, 80);
        keyLight.position.set(12, 10, 12);
        scene.add(keyLight);
        const rimLight = new THREE.PointLight(0xe879f9, 1.4, 80);
        rimLight.position.set(-12, -6, 10);
        scene.add(rimLight);

        // --- Shared glow sprite texture ---
        function makeGlowSprite(hex) {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const g = c.getContext('2d');
            const col = new THREE.Color(hex);
            const rgb = `${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)}`;
            const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, `rgba(${rgb},1)`);
            grad.addColorStop(0.35, `rgba(${rgb},0.55)`);
            grad.addColorStop(1, `rgba(${rgb},0)`);
            g.fillStyle = grad;
            g.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        // --- Figure-8 flight path (same ∞ the hub rides) ---
        const SCALE = 10;
        function flightPath(t) {
            const s = Math.sin(t), c = Math.cos(t);
            const denom = 1 + s * s;
            return new THREE.Vector3(
                (SCALE * c) / denom,
                (SCALE * 0.55 * s * c) / denom + Math.sin(t * 3) * 0.7,
                Math.sin(t * 2) * 3.2
            );
        }

        function buildFlightCurve() {
            const pts = [];
            for (let i = 0; i < 256; i++) pts.push(flightPath((i / 256) * Math.PI * 2));
            return new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
        }
        const flightCurve = buildFlightCurve();

        // Holographic ribbon tracing the flight path
        const ribbon = new THREE.Mesh(
            new THREE.TubeGeometry(flightCurve, 320, 0.035, 8, true),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        scene.add(ribbon);
        const ribbonHalo = new THREE.Mesh(
            new THREE.TubeGeometry(flightCurve, 320, 0.16, 8, true),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        scene.add(ribbonHalo);

        // --- Holographic matrix floor ---
        (function addMatrix() {
            const grid = new THREE.GridHelper(90, 45, 0x38bdf8, 0x123);
            grid.position.y = -6;
            grid.material.transparent = true;
            grid.material.opacity = 0.55;
            grid.material.blending = THREE.AdditiveBlending;
            grid.material.depthWrite = false;
            scene.add(grid);

            // Hologram rings rising from the matrix
            for (let i = 0; i < 5; i++) {
                const r = 4 + i * 3.2;
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(r, r + 0.05, 96),
                    new THREE.MeshBasicMaterial({ color: i % 2 ? 0xe879f9 : 0x38bdf8, transparent: true, opacity: 0.3, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
                );
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = -6.9 + i * 0.15;
                ring.userData.spin = (i % 2 ? -1 : 1) * (0.04 + i * 0.015);
                ring.name = 'holoRing' + i;
                scene.add(ring);
            }
        })();

        // --- Starfield ---
        (function addStars() {
            const N = 1200;
            const pos = new Float32Array(N * 3);
            const col = new Float32Array(N * 3);
            const tint = new THREE.Color();
            for (let i = 0; i < N; i++) {
                const r = 60 + rand() * 140;
                const th = rand() * Math.PI * 2;
                const ph = Math.acos(2 * rand() - 1);
                pos[i*3] = r * Math.sin(ph) * Math.cos(th);
                pos[i*3+1] = r * Math.cos(ph);
                pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
                const pick = rand();
                tint.setHex(pick < 0.7 ? 0x94a3b8 : (pick < 0.88 ? 0x38bdf8 : 0xe879f9));
                const dim = 0.35 + rand() * 0.6;
                col[i*3] = tint.r * dim; col[i*3+1] = tint.g * dim; col[i*3+2] = tint.b * dim;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.35, vertexColors: true, transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending, depthWrite: false
            }));
            stars.name = 'starfield';
            scene.add(stars);
        })();

        // ============================================================
        // THE CYBER DRAGON — 42 holographic segments + head + wings
        // ============================================================
        const dragon = new THREE.Group();
        scene.add(dragon);

        const SEGMENTS = 42;
        const SEG_GAP = 0.052;
        const bodySegs = [];
        const cyan = new THREE.Color(0x38bdf8);
        const magenta = new THREE.Color(0xe879f9);

        function segRadius(i) {
            // taper: head bulge -> neck -> body -> tail whip
            const t = i / SEGMENTS;
            const body = Math.sin(Math.min(1, t * 2.2) * Math.PI * 0.5); // ramp up from head
            const taper = 1 - t * 0.85;
            return (0.28 + body * 0.5) * taper + 0.05;
        }

        for (let i = 0; i < SEGMENTS; i++) {
            const col = cyan.clone().lerp(magenta, i / SEGMENTS);
            const r = segRadius(i);
            const seg = new THREE.Mesh(
                new THREE.IcosahedronGeometry(r, 1),
                new THREE.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.9 })
            );
            // inner glow core
            const core = new THREE.Sprite(new THREE.SpriteMaterial({
                map: makeGlowSprite(col.getHex()), transparent: true, opacity: 0.35,
                blending: THREE.AdditiveBlending, depthWrite: false
            }));
            core.scale.set(r * 3.2, r * 3.2, 1);
            seg.add(core);
            dragon.add(seg);
            bodySegs.push(seg);

            // spine spike every 3rd segment
            if (i % 3 === 1 && i < SEGMENTS - 4) {
                const spike = new THREE.Mesh(
                    new THREE.ConeGeometry(r * 0.32, r * 1.5, 4),
                    new THREE.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.8 })
                );
                spike.position.y = r * 1.1;
                seg.add(spike);
            }
        }

        // --- Head ---
        const head = new THREE.Group();
        const skull = new THREE.Mesh(
            new THREE.ConeGeometry(0.55, 1.6, 6),
            new THREE.MeshBasicMaterial({ color: 0x7dd3fc, wireframe: true, transparent: true, opacity: 0.95 })
        );
        skull.rotation.x = Math.PI / 2; // point forward (+Z)
        head.add(skull);

        // horns
        for (const side of [-1, 1]) {
            const horn = new THREE.Mesh(
                new THREE.ConeGeometry(0.12, 0.9, 4),
                new THREE.MeshBasicMaterial({ color: 0xe879f9, wireframe: true, transparent: true, opacity: 0.9 })
            );
            horn.position.set(side * 0.28, 0.32, -0.45);
            horn.rotation.x = -0.7;
            horn.rotation.z = side * 0.25;
            head.add(horn);
        }

        // eyes — gold glow (the 9th-dimension stare)
        const eyeTex = makeGlowSprite(0xfacc15);
        for (const side of [-1, 1]) {
            const eye = new THREE.Sprite(new THREE.SpriteMaterial({
                map: eyeTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            eye.scale.set(0.42, 0.42, 1);
            eye.position.set(side * 0.24, 0.08, 0.35);
            head.add(eye);
        }
        dragon.add(head);

        // --- Wings (holographic membranes) ---
        function makeWing(side) {
            const geo = new THREE.BufferGeometry();
            const verts = new Float32Array([
                0, 0, 0,
                side * 3.4, 1.6, -1.2,
                side * 2.6, 0.2, -2.4,
                0, 0, 0,
                side * 2.6, 0.2, -2.4,
                side * 1.4, -0.4, -1.6
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            geo.computeVertexNormals();
            const wing = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                color: 0xe879f9, wireframe: true, transparent: true, opacity: 0.65, side: THREE.DoubleSide
            }));
            return wing;
        }
        const wingL = makeWing(-1);
        const wingR = makeWing(1);
        bodySegs[6].add(wingL);
        bodySegs[6].add(wingR);

        // --- Energy pulses riding the flight path ---
        const pulses = [];
        const pulseTexCyan = makeGlowSprite(0x7dd3fc);
        const pulseTexGold = makeGlowSprite(0xfde68a);
        for (let i = 0; i < 24; i++) {
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({
                map: i % 6 === 5 ? pulseTexGold : pulseTexCyan,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            const size = 0.3 + rand() * 0.4;
            spr.scale.set(size, size, 1);
            scene.add(spr);
            pulses.push({ sprite: spr, t: rand(), speed: 0.04 + rand() * 0.05 });
        }

        // --- Flight state ---
        let dragonT = 0;
        let isFlying = true;
        let audioLevel = 0; // 0..1 audio-reactive glow

        const tmpA = new THREE.Vector3();
        const tmpB = new THREE.Vector3();

        function updateDragon(dt) {
            if (isFlying) dragonT += dt * 0.5;

            // head
            const hp = flightCurve.getPointAt(((dragonT % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2));
            head.position.copy(hp);
            flightCurve.getPointAt((((dragonT + 0.05) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2), tmpB);
            head.lookAt(tmpB);

            // body follows with phase lag
            for (let i = 0; i < SEGMENTS; i++) {
                const ti = dragonT - (i + 1) * SEG_GAP;
                const u = (((ti % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2);
                bodySegs[i].position.copy(flightCurve.getPointAt(u));
                // serpentine wiggle + audio-reactive pulse
                const wob = 1 + Math.sin(ti * 6) * 0.08 + audioLevel * 0.25;
                bodySegs[i].scale.set(wob, wob, wob);
                bodySegs[i].rotation.y = ti * 2;
            }

            // wing flap
            const flap = Math.sin(dragonT * 8) * (0.55 + audioLevel * 0.3);
            wingL.rotation.z = -flap;
            wingR.rotation.z = flap;

            // ribbon breathes with audio
            ribbon.material.opacity = 0.55 + audioLevel * 0.35;
        }

        // --- Interaction: drag orbit ---
        const raycaster = new THREE.Raycaster();
        let dragState = null;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            dragState = { x: e.clientX, y: e.clientY };
            orbit.returning = false;
            renderer.domElement.classList.add('dragging');
            renderer.domElement.setPointerCapture(e.pointerId);
        });
        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!dragState) return;
            const dx = e.clientX - dragState.x;
            const dy = e.clientY - dragState.y;
            dragState.x = e.clientX;
            dragState.y = e.clientY;
            orbit.velTheta = -dx * 0.0035;
            orbit.velPhi = -dy * 0.0028;
            orbit.theta += orbit.velTheta;
            orbit.phi = Math.max(0.35, Math.min(Math.PI - 0.35, orbit.phi + orbit.velPhi));
        });
        function endDrag() { dragState = null; renderer.domElement.classList.remove('dragging'); }
        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // --- 432Hz Spatial Synth (audio-reactive via analyser) ---
        let audioCtx = null, analyser = null, audioNodes = null, isAudioPlaying = false;
        let freqData = null;

        function toggleHarmonicAudio() {
            const btn = document.getElementById('btn-harmonic');
            if (!isAudioPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                freqData = new Uint8Array(analyser.frequencyBinCount);

                const master = audioCtx.createGain();
                master.gain.setValueAtTime(0.01, audioCtx.currentTime);
                master.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 2.5);
                master.connect(analyser);
                analyser.connect(audioCtx.destination);

                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.setValueAtTime(0.1, audioCtx.currentTime);
                lfoGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                lfo.connect(lfoGain); lfoGain.connect(master.gain); lfo.start();

                const voices = [];
                const stack = [
                    { freq: 216, gain: 0.35 }, { freq: 432, gain: 0.6 }, { freq: 864, gain: 0.12 }
                ];
                for (const v of stack) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(v.freq, audioCtx.currentTime);
                    g.gain.setValueAtTime(v.gain, audioCtx.currentTime);
                    osc.connect(g); g.connect(master); osc.start();
                    voices.push(osc);
                }
                audioNodes = { master, lfo, voices };
                isAudioPlaying = true;
                btn.classList.add('active');
                document.getElementById('freq-display').innerText = '432 Hz (Active)';
            } else {
                if (audioNodes) {
                    const t = audioCtx.currentTime;
                    audioNodes.master.gain.cancelScheduledValues(t);
                    audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, t);
                    audioNodes.master.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                    const nodes = audioNodes;
                    setTimeout(() => {
                        nodes.voices.forEach(o => { try { o.stop(); } catch (err) {} });
                        try { nodes.lfo.stop(); } catch (err) {}
                    }, 900);
                    audioNodes = null;
                }
                analyser = null;
                audioLevel = 0;
                isAudioPlaying = false;
                btn.classList.remove('active');
                document.getElementById('freq-display').innerText = '432 Hz';
            }
        }

        function toggleFlight() {
            isFlying = !isFlying;
            const btn = document.getElementById('btn-flow');
            btn.classList.toggle('active', isFlying);
            document.getElementById('phase-display').innerText = isFlying ? 'DUAL-PHASE' : 'HOVER';
        }

        function resetCameraView() { orbit.returning = true; }

        // --- Kombucha Easter Egg (kept) ---
        function triggerKombuchaEasterEgg() {
            for (let i = 0; i < 36; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                const size = 8 + rand() * 26;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = (rand() * 100) + 'vw';
                b.style.animationDuration = (2.2 + rand() * 2.8) + 's';
                b.style.animationDelay = (rand() * 0.9) + 's';
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 6500);
            }
            const toast = document.getElementById('kombuchaToast');
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3200);
        }

        // --- Render Loop ---
        const clock = new THREE.Clock();
        let ready = false;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // audio-reactive level
            if (analyser && freqData) {
                analyser.getByteFrequencyData(freqData);
                let sum = 0;
                for (let i = 0; i < freqData.length; i++) sum += freqData[i];
                const target = (sum / freqData.length) / 140;
                audioLevel += (Math.min(1, target) - audioLevel) * 0.15;
            }

            updateDragon(dt);

            // pulses ride the flight path
            for (const p of pulses) {
                p.t = (p.t + p.speed * dt) % 1;
                p.sprite.position.copy(flightCurve.getPointAt(p.t));
            }

            // holo rings spin
            for (let i = 0; i < 5; i++) {
                const ring = scene.getObjectByName('holoRing' + i);
                if (ring) ring.rotation.z += ring.userData.spin * dt;
            }

            // orbit
            if (!dragState) {
                orbit.theta += orbit.velTheta;
                orbit.phi = Math.max(0.35, Math.min(Math.PI - 0.35, orbit.phi + orbit.velPhi));
                orbit.velTheta *= 0.94;
                orbit.velPhi *= 0.94;
                if (orbit.returning) {
                    const k = Math.min(1, dt * 2.5);
                    orbit.theta += (orbit.homeTheta - orbit.theta) * k;
                    orbit.phi += (orbit.homePhi - orbit.phi) * k;
                    orbit.radius += (orbit.homeRadius - orbit.radius) * k;
                    if (Math.abs(orbit.theta - orbit.homeTheta) < 0.002) orbit.returning = false;
                } else if (Math.abs(orbit.velTheta) < 0.0004) {
                    orbit.theta += dt * 0.04;
                }
            }
            applyOrbit();
            camera.position.y += Math.sin(elapsed * 0.25) * 0.15;

            const stars = scene.getObjectByName('starfield');
            if (stars) stars.rotation.y += dt * 0.004;

            renderer.render(scene, camera);
            if (!ready) { ready = true; window.__SCENE_READY__ = true; }
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
