<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Motion TV &bull; Slick Bright Wave & Aquarium Masterclass</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff007f;
            --neon-purple: #bd00ff;
            --fern-green: #00ff88;
            --tiki-gold: #ffcc00;
            --dark-bg: #010403;
            --glass-bg: rgba(2, 12, 8, 0.65);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }
        #webgl-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        /* Slick Non-Intrusive HUD */
        .ui-overlay {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 24px;
            pointer-events: none;
        }
        header, .bottom-dock, footer {
            pointer-events: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 10px 20px;
            border-radius: 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        .brand-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--fern-green), var(--neon-cyan), var(--tiki-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0,255,136,0.5);
        }
        .node-tag {
            font-size: 0.7rem;
            color: var(--tiki-gold);
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            color: var(--fern-green);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 6px 12px;
            border: 1px solid rgba(0,255,136,0.4);
            border-radius: 8px;
            background: rgba(0,255,136,0.05);
            transition: all 0.3s ease;
        }
        .nav-links a:hover {
            background: var(--fern-green);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--fern-green);
        }

        /* Bottom Dock to keep center canvas completely clear */
        .bottom-dock {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            gap: 16px;
        }
        .dock-panel {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 255, 136, 0.25);
            border-radius: 14px;
            padding: 12px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 25px rgba(0,243,255,0.15);
            max-width: 320px;
            width: 100%;
        }
        .dock-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--neon-cyan);
            border-bottom: 1px solid rgba(0,255,136,0.2);
            padding-bottom: 4px;
        }
        .audio-player {
            width: 100%;
            height: 32px;
            margin-bottom: 8px;
            accent-color: var(--fern-green);
        }
        .playlist-info {
            font-size: 0.75rem;
            color: var(--tiki-gold);
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 6px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        button {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 0.75rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--neon-cyan);
        }
        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        .shop-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item h4 { font-size: 0.75rem; font-family: 'Orbitron', sans-serif; color: #fff; }
        .shop-item p { font-size: 0.65rem; color: rgba(255,255,255,0.6); }
        .price-tag { font-family: 'Orbitron', sans-serif; color: var(--tiki-gold); font-size: 0.75rem; font-weight: 700; }
        .buy-btn { background: linear-gradient(135deg, var(--fern-green), #00b4d8); font-size: 0.65rem; padding: 4px 8px; color: #010403; }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            background: var(--glass-bg);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(0,255,136,0.15);
        }
        footer a { color: var(--fern-green); text-decoration: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    
    <div class="ui-overlay">
        <header>
            <div class="brand-box">
                <h1>FLUID MOTION TV</h1>
                <div class="node-tag">FERN GARDEN &bull; AQUARIUM TUNNEL &bull; BRIGHT WAVE FX</div>
            </div>
            <div class="nav-links">
                <a href="https://dragon9.online" target="_blank">Dragon Nine Online</a>
                <a href="#shop" onclick="alert('Exploring Merch Hub!');">Shop Hub</a>
            </div>
        </header>

        <div class="bottom-dock">
            <div class="dock-panel">
                <h3>AUDIO & VIBE CONTROL</h3>
                <div class="playlist-info" id="now-playing">Now Playing: Raw Power</div>
                <audio id="audio" class="audio-player" controls crossorigin="anonymous">
                    <source src="raw_power.mp3" type="audio/mp3">
                    Your browser does not support the audio element.
                </audio>
                <div class="btn-group">
                    <button id="btn-mode">Morph 3D</button>
                    <button id="btn-next">Next Track</button>
                </div>
            </div>

            <div class="dock-panel">
                <h3>MERCH SHOP HUB</h3>
                <div class="shop-items">
                    <div class="shop-item">
                        <div>
                            <h4>Fern Path Hoodie</h4>
                            <p>Organic forest fleece</p>
                        </div>
                        <div>
                            <div class="price-tag">$65.00</div>
                            <button class="buy-btn" onclick="alert('Purchased Fern Path Hoodie!');">Buy</button>
                        </div>
                    </div>
                    <div class="shop-item">
                        <div>
                            <h4>Raw Proof LP</h4>
                            <p>Stoner Hip Hop Mix</p>
                        </div>
                        <div>
                            <div class="price-tag">$35.00</div>
                            <button class="buy-btn" onclick="alert('Purchased Raw Proof LP!');">Buy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            Fluid Motion TV &bull; Master Hub &bull; <a href="https://dragon9.online" target="_blank">Dragon Nine Online</a>
        </footer>
    </div>

    <script>
        // Dual-Track Audio Playlist
        const playlist = [
            { src: "raw_power.mp3", title: "Raw Power" },
            { src: "20260724 - Gypsy Children of smoke Vol. 2 (Cypress Hill Inspired) Stoner hip hop mix [bI8T0YQSqgY].m4a", title: "Gypsy Children of Smoke" }
        ];
        let currentTrackIndex = 0;
        const audio = document.getElementById('audio');
        const nowPlayingEl = document.getElementById('now-playing');

        function loadTrack(index) {
            currentTrackIndex = index % playlist.length;
            audio.src = playlist[currentTrackIndex].src;
            nowPlayingEl.textContent = "Now Playing: " + playlist[currentTrackIndex].title;
            audio.play().catch(e => console.log("Autoplay waiting for interaction"));
        }

        audio.addEventListener('ended', () => {
            loadTrack(currentTrackIndex + 1);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            loadTrack(currentTrackIndex + 1);
        });

        // --- TRUE 3D WEBGL SETUP ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010403, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x00ff88, 1.2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00f3ff, 5, 70);
        pointLight1.position.set(0, 6, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff007f, 5, 70);
        pointLight2.position.set(0, -6, -5);
        scene.add(pointLight2);

        // 1. Aquarium Tunnel Effect (Bright Bioluminescent Rings)
        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);
        const ringCount = 25;
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            const ringGeo = new THREE.TorusGeometry(8, 0.22, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({
                color: i % 2 === 0 ? 0x00f3ff : 0x00ff88,
                emissive: i % 2 === 0 ? 0x00f3ff : 0x00ff88,
                emissiveIntensity: 0.8,
                roughness: 0.1
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.z = -i * 2.5;
            tunnelGroup.add(ring);
            rings.push(ring);
        }

        // 2. Swimming Fish School in the Aquarium Tunnel
        const fishGroup = new THREE.Group();
        scene.add(fishGroup);
        const fishCount = 40;
        const fishList = [];
        const fishGeo = new THREE.ConeGeometry(0.25, 0.7, 6);
        fishGeo.rotateX(Math.PI / 2);

        for (let i = 0; i < fishCount; i++) {
            const fishMat = new THREE.MeshStandardMaterial({
                color: i % 3 === 0 ? 0x00f3ff : (i % 3 === 1 ? 0xffcc00 : 0xff007f),
                emissive: i % 3 === 0 ? 0x00f3ff : 0xffcc00,
                emissiveIntensity: 0.6,
                roughness: 0.2
            });
            const fish = new THREE.Mesh(fishGeo, fishMat);
            fish.position.set(
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 45
            );
            fish.userData = {
                speed: 0.06 + Math.random() * 0.08,
                angle: Math.random() * Math.PI * 2,
                radius: 4 + Math.random() * 4
            };
            fishGroup.add(fish);
            fishList.push(fish);
        }

        // 3. Center 3D Audio-Reactive Torus Knot Core (Cyber-Tiki)
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const geometry = new THREE.TorusKnotGeometry(2.2, 0.6, 128, 32);
        const material = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: false
        });
        const coreMesh = new THREE.Mesh(geometry, material);
        coreGroup.add(coreMesh);

        // 4. Bright Audio-Reactive Fern Garden & Ocean Waves (Grid Plane)
        const waveWidth = 50;
        const waveHeight = 50;
        const waveSegments = 50;
        const waveGeo = new THREE.PlaneGeometry(waveWidth, waveHeight, waveSegments, waveSegments);
        waveGeo.rotateX(-Math.PI / 2);
        const waveMat = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            wireframe: true,
            roughness: 0.2,
            metalness: 0.9,
            emissive: 0x00ff88,
            emissiveIntensity: 0.4
        });
        const waveMesh = new THREE.Mesh(waveGeo, waveMat);
        waveMesh.position.y = -4.5;
        scene.add(waveMesh);

        // Audio Analyser
        let audioCtx, analyser, dataArray;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInitialized = true;
            } catch(e) {
                console.log("Audio waiting for user interaction", e);
            }
        }

        audio.addEventListener('play', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        let mode = 0;
        document.getElementById('btn-mode').addEventListener('click', () => {
            mode = (mode + 1) % 3;
            if (mode === 0) {
                material.wireframe = false;
                material.color.setHex(0xffcc00);
            } else if (mode === 1) {
                material.wireframe = true;
                material.color.setHex(0x00ff88);
            } else {
                material.wireframe = false;
                material.color.setHex(0x00f3ff);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();
            let bass = 50;

            if (analyser && isAudioInitialized) {
                analyser.getByteFrequencyData(dataArray);
                bass = dataArray[2] || 50;
            }

            // Animate Core Torus Knot to Bass
            let bassScale = 1 + (bass / 90);
            coreMesh.scale.set(bassScale, bassScale, bassScale);
            coreMesh.rotation.x = elapsedTime * 0.4;
            coreMesh.rotation.y = elapsedTime * 0.6;

            // Animate Aquarium Tunnel Forward Flow
            rings.forEach((ring, idx) => {
                ring.position.z += 0.1 + (bass * 0.0015);
                if (ring.position.z > 5) {
                    ring.position.z = -ringCount * 2.5 + 5;
                }
                ring.rotation.z = elapsedTime * 0.25 + idx;
            });

            // Animate Swimming Fish Schools
            fishList.forEach((fish, idx) => {
                fish.userData.angle += fish.userData.speed * 0.6;
                fish.position.x = Math.cos(fish.userData.angle + idx) * fish.userData.radius;
                fish.position.y = Math.sin(fish.userData.angle * 0.8 + idx) * 3;
                fish.position.z += 0.18 + (bass * 0.0025);
                if (fish
