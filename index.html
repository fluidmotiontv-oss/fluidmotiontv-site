<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Motion TV | The Fluid Motion of the Future</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #070913;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #horizon-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: #070913;
        }

        .portal-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem 1.5rem;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem 1rem;
            background: rgba(7, 9, 19, 0.85);
            border-bottom: 1px solid rgba(0, 198, 255, 0.25);
            margin-bottom: 2.5rem;
            border-radius: 0 0 20px 20px;
        }

        header h1 {
            font-size: clamp(2rem, 4.5vw, 4rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rtem;
        }

        header p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 580px;
            margin: 0 auto 1.5rem auto;
            line-height: 1.5;
        }

        .audio-player-bar {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 198, 255, 0.1);
            border: 1px solid rgba(0, 198, 255, 0.3);
            padding: 0.75rem 1.25rem;
            border-radius: 30px;
        }

        .audio-player-bar button {
            background: #00c6ff;
            color: #070913;
            border: none;
            padding: 0.5rem 1rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
        }

        .track-info {
            font-size: 0.9rem;
            color: #f8fafc;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: #00c6ff;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 198, 255, 0.25);
        }

        .tiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .tier-card {
            background: rgba(12, 16, 28, 0.85);
            border: 1px solid rgba(0, 198, 255, 0.25);
            border-radius: 14px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
        }

        .tier-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffb703;
            text-transform: uppercase;
        }

        .tier-price {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
        }

        .tier-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }

        .tier-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 198, 255, 0.15);
            border: 1px solid #00c6ff;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .checkout-btn:hover {
            background: #00c6ff;
            color: #070913;
        }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #94a3b8;
            font-size: 0.85rem;
            border-top: 1px solid rgba(0, 198, 255, 0.25);
        }

        footer span {
            color: #00c6ff;
        }
    </style>
</head>
<body>

    <canvas id="horizon-canvas"></canvas>

    <div class="portal-wrapper">
        <header>
            <h1>Fluid Motion TV</h1>
            <p>Real-time audio-reactive horizon, pure harmonic resonance, and the sovereign shop tiers.</p>
            
            <div class="audio-player-bar">
                <button id="play-toggle-btn" onclick="togglePlaylist()">Play Audio</button>
                <div class="track-info" id="track-label">Ready: Raw Power &rarr; Dawn's Mix</div>
            </div>
        </header>

        <main>
            <div class="section-title">Nine Sovereign Shop Tiers</div>
            
            <div class="tiers-grid">
                <!-- Tiers 1 to 9 -->
                <script>
                    const tiers = [
                        {num: "01", price: "$9 NZD", title: "Harmonic Seed", desc: "Initial digital asset bundle featuring base 432Hz ambient audio stems and wallpaper suite."},
                        {num: "02", price: "$25 NZD", title: "Horizon Generator", desc: "Standalone WebGL canvas script and modular horizon animation engine for local server hosting."},
                        {num: "03", price: "$50 NZD", title: "Plasma Frequency Suite", desc: "Full spectrum audio collection tuned with Solfeggio overtones and rhythmic dub loops."},
                        {num: "04", price: "$99 NZD", title: "Sovereign Node Access", desc: "Early access pass to PWA factory portals, local node scripts, and decentralized streaming tools."},
                        {num: "05", price: "$150 NZD", title: "Creative Suite Pro", desc: "Complete source code repositories for all motion graphics templates, UI kits, and visual assets."},
                        {num: "06", price: "$250 NZD", title: "Atmospheric Grid Builder", desc: "Advanced harmonic grid calculator toolkit and local frequency harvesting documentation."},
                        {num: "07", price: "$500 NZD", title: "Broadcast Partner Pass", desc: "Direct licensing rights for streaming background environments and collaborative media production."},
                        {num: "08", price: "$1,000 NZD", title: "Core Infrastructure Tier", desc: "Full deployment package with dedicated Caddy reverse proxy configurations and multi-domain routing setups."},
                        {num: "09", price: "$2,500 NZD", title: "Ultimate Sovereign License", desc: "Unlimited enterprise access to all current and future modular PWA engines, repositories, and creator collaboration."}
                    ];

                    document.write(tiers.map((t, i) => `
                        <div class="tier-card">
                            <div>
                                <div class="tier-header"><span class="tier-number">Tier ${t.num}</span><span class="tier-price">${t.price}</span></div>
                                <div class="tier-title">${t.title}</div>
                                <div class="tier-desc">${t.desc}</div>
                            </div>
                            <a href="https://www.paypal.com/ncp/payment?hosted_button_id=YOUR_PAYPAL_ID_${i+1}" target="_blank" rel="noopener" class="checkout-btn">Secure Tier ${t.num}</a>
                        </div>
                    `).join(''));
                </script>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Fluid Motion Limited. Powered by <span>the fluid motion of the future</span>.</p>
        </footer>
    </div>

    <audio id="track-1" src="raw-power.mp3" preload="auto"></audio>
    <audio id="track-2" src="dawn1music.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('horizon-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        let isPlaying = false;
        let audioLevel = 0.05;

        const track1 = document.getElementById('track-1');
        const track2 = document.getElementById('track-2');

        track1.onended = () => {
            document.getElementById('track-label').innerText = "Now Playing: Dawn's Mix";
            track2.play().catch(e => console.log("Track 2 error", e));
        };

        track2.onended = () => {
            document.getElementById('track-label').innerText = "Playlist Complete (Looping)";
            track1.currentTime = 0;
            track1.play().catch(e => console.log("Loop error", e));
        };

        function togglePlaylist() {
            const btn = document.getElementById('play-toggle-btn');
            if (!isPlaying) {
                track1.play().then(() => {
                    isPlaying = true;
                    audioLevel = 0.18;
                    btn.innerText = "Pause Audio";
                    document.getElementById('track-label').innerText = "Now Playing: Raw Power";
                }).catch(e => console.log("Play blocked", e));
            } else {
                track1.pause();
                track2.pause();
                isPlaying = false;
                audioLevel = 0.05;
                btn.innerText = "Play Audio";
                document.getElementById('track-label').innerText = "Audio Paused";
            }
        }

        function drawHorizon() {
            ctx.fillStyle = '#070913';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            time += 0.01;

            const horizonY = canvas.height * 0.42;
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(canvas.width, horizonY);
            ctx.strokeStyle = `rgba(0, 198, 255, ${0.15 + audioLevel})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                const yBase = horizonY + 20 + (i * 45);
                const amplitude = (15 + (i * 8)) * (1 + audioLevel * 2);
                const frequency = 0.002 - (i * 0.0004);

                for (let x = 0; x <= canvas.width; x += 20) {
                    const wave = Math.sin(x * frequency + time * (1 + i * 0.2)) * Math.cos(time * 0.5 + x * 0.001);
                    const y = yBase + (wave * amplitude);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.strokeStyle = i === 0 ? `rgba(0, 198, 255, ${0.25 + audioLevel})` : `rgba(0, 114, 255, ${0.15})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            requestAnimationFrame(drawHorizon);
        }

        drawHorizon();
    </script>
</body>
</html>
